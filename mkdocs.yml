site_name: mship
site_description: Phase-based workflow engine for multi-repo AI development
site_url: https://atomikpanda.github.io/mothership/
repo_url: https://github.com/atomikpanda/mothership
repo_name: atomikpanda/mothership

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  plans/
  specs/
  superpowers/

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Ship a feature: guides/ship-a-feature.md
      - Fix a bug: guides/fix-a-bug.md
      - Multi-repo tasks: guides/multi-repo-tasks.md
      - Run & observe: guides/run-and-observe.md
      - Phone control: guides/phone-control.md
      - Agent-driven development: guides/agent-driven-development.md
      - Specs & plans across machines: guides/specs-across-machines.md
  - Concepts: concepts.md
  - Reference:
      - CLI reference: cli.md
      - Configuration: configuration.md
      - Daemon operations: daemon.md
  - Remote access:
      - Serve over Tailscale: mship-serve-tailscale.md
      - Relay hosting: relay-hosting.md
      - Remote run: remote-run.md
  - Cloud workers:
      - Unattended cloud runner: unattended-cloud-runner.md
      - Attach-at-relay egress proxy: cloud-worker-auth-spine.md
      - The /gh-token broker: cloud-agent-auth.md
      - Pull-API runner (Claude routine): adapters/claude-routine-runner.md
