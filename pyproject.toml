[project]
name = "mothership"
version = "0.5.58"
description = "Phase-based workflow engine for multi-repo AI development"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.13",
    "rich>=13.0",
    "textual>=0.80",
    "InquirerPy>=0.3",
    "dependency-injector>=4.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "segno>=1.6.6",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "cryptography>=50.0.0",
    "jinja2>=3.1",
]

[project.scripts]
mship = "mship.cli:run"
mshipd = "mship.core.daemon.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mship"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.pyrefly]
preset = "basic"
search-path = ["src", "."]
project-includes = ["src", "tests"]
disable-project-excludes-heuristics = true

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-tmp-files>=0.0.2",
    "pytest-asyncio>=0.23",
    "coverage>=7.13.5",
    "pyrefly>=1.2.0",
    "ruff>=0.16.4",
]
docs = [
    "mkdocs-material>=9.5",
]
